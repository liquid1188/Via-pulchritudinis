<div class="popes">
        <figure class="pq">
          <div class="meta"><span class="label who">Pius XII</span><span class="label">8 November 1957</span></div>
          <blockquote>“Society, so to speak, speaks through the clothing it wears.”</blockquote>
          <figcaption class="doc">Address to the First International Congress of High Fashion, convened by the Latin Union of High Fashion. <a href="https://www.vatican.va/content/pius-xii/it/speeches/1957/documents/hf_p-xii_spe_19571108_alta-moda.html" target="_blank" rel="noopener">Read the address (Italian)</a></figcaption>
          <p class="note">Translated from the Italian, “La società, per così dire, parla col vestito che indossa.” In the same address Pius names hygiene, modesty, and decorum as the purposes clothing serves, and calls fashion an ancient art.</p>
        </figure>
        <figure class="pq">
          <div class="meta"><span class="label who">Paul VI</span><span class="label">8 December 1965</span></div>
          <blockquote>“This world in which we live needs beauty in order not to sink into despair.”</blockquote>
          <figcaption class="doc">Address to artists at the closing of the Second Vatican Council. <a href="https://www.vatican.va/content/paul-vi/en/speeches/1965/documents/hf_p-vi_spe_19651208_epilogo-concilio-artisti.html" target="_blank" rel="noopener">Read the address</a></figcaption>
        </figure>
        <figure class="pq">
          <div class="meta"><span class="label who">St. John Paul II</span><span class="label">4 April 1999</span></div>
          <blockquote>“Beauty is a key to the mystery and a call to transcendence.”</blockquote>
          <figcaption class="doc">Letter to Artists, §16. <a href="https://www.vatican.va/content/john-paul-ii/en/letters/1999/documents/hf_jp-ii_let_23041999_artists.html" target="_blank" rel="noopener">Read the letter</a></figcaption>
        </figure>
        <figure class="pq">
          <div class="meta"><span class="label who">St. John Paul II</span><span class="label">4 April 1999</span></div>
          <blockquote>“In order to communicate the message entrusted to her by Christ, the Church needs art.”</blockquote>
          <figcaption class="doc">Letter to Artists, §12. <a href="https://www.vatican.va/content/john-paul-ii/en/letters/1999/documents/hf_jp-ii_let_23041999_artists.html" target="_blank" rel="noopener">Read the letter</a></figcaption>
        </figure>
        <figure class="pq">
          <div class="meta"><span class="label who">St. John Paul II</span><span class="label">4 April 1999</span></div>
          <blockquote>“Beauty is the vocation bestowed on him by the Creator in the gift of ‘artistic talent’.”</blockquote>
          <figcaption class="doc">Letter to Artists, §3, which also calls beauty “the visible form of the good.” <a href="https://www.vatican.va/content/john-paul-ii/en/letters/1999/documents/hf_jp-ii_let_23041999_artists.html" target="_blank" rel="noopener">Read the letter</a></figcaption>
        </figure>
        <figure class="pq">
          <div class="meta"><span class="label who">Benedict XVI</span><span class="label">22 February 2007</span></div>
          <blockquote>“Beauty, then, is not mere decoration, but rather an essential element of the liturgical action…”</blockquote>
          <figcaption class="doc">Post-synodal apostolic exhortation <em>Sacramentum Caritatis</em>, §35. <a href="https://www.vatican.va/content/benedict-xvi/en/apost_exhortations/documents/hf_ben-xvi_exh_20070222_sacramentum-caritatis.html" target="_blank" rel="noopener">Read the exhortation</a></figcaption>
        </figure>
        <figure class="pq">
          <div class="meta"><span class="label who">Benedict XVI, quoting Simone Weil</span><span class="label">21 November 2009</span></div>
          <blockquote>“Beauty is the experimental proof that incarnation is possible.”</blockquote>
          <figcaption class="doc">Address at the Meeting with Artists in the Sistine Chapel, where Benedict quoted the French philosopher Simone Weil. <a href="https://www.vatican.va/content/benedict-xvi/en/speeches/2009/november/documents/hf_ben-xvi_spe_20091121_artisti.html" target="_blank" rel="noopener">Read the address</a></figcaption>
        </figure>
        <figure class="pq">
          <div class="meta"><span class="label who">Francis</span><span class="label">24 November 2013</span></div>
          <blockquote>“Every form of authentic beauty can thus be acknowledged as a path leading to an encounter with the Lord Jesus.”</blockquote>
          <figcaption class="doc">Apostolic exhortation <em>Evangelii Gaudium</em>, §167, on the <em>via pulchritudinis</em>. <a href="https://www.vatican.va/content/francesco/en/apost_exhortations/documents/papa-francesco_esortazione-ap_20131124_evangelii-gaudium.html" target="_blank" rel="noopener">Read the exhortation</a></figcaption>
        </figure>
        <figure class="pq">
          <div class="meta"><span class="label who">Leo XIV</span><span class="label">18 July 2026</span></div>
          <blockquote>“We live in a world where beauty is lacking.”</blockquote>
          <figcaption class="doc">Greeting at the end of a concert in his honor in the courtyard of the Apostolic Palace at Castel Gandolfo. <a href="https://www.vatican.va/content/leo-xiv/en/speeches/2026/july/documents/20260718-concerto.html" target="_blank" rel="noopener">Read the greeting</a></figcaption>
        </figure>
      </div>
